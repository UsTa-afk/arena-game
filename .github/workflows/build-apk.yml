name: Build Android APK & Release

on:
  push:
    branches:
      - UsTa-afk-stitch
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare Web Assets (www)
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css js assets www/

      - name: Initialize Capacitor & Android Platform
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Arena Battle" "com.ustaafk.arenabattle" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Arena-Battle.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arena-Battle-APK
          path: Arena-Battle.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Arena Battle - Android APK (Latest)"
          body: |
            ### 📲 Arena Battle — Android APK
            Download **`Arena-Battle.apk`** below and install it on your Android device.
          files: Arena-Battle.apk
          prerelease: false
          make_latest: true
